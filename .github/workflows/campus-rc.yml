name: Campus RC

on:
  push:
    branches: [muc-main, hubu-main, feat/dual-window-quota, feat/hubu-dual-window-quota, feat/reward-motion-system]
  pull_request:
    branches: [muc-main, hubu-main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  source-gate:
    name: Canonical source and brand tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Brand registry gate
        working-directory: packages/brand
        run: bun test
      - name: Desktop identity gates
        working-directory: packages/desktop
        run: bun test electron-builder.config.test.ts scripts/campus-config.test.ts scripts/muc-version.test.ts
      - name: RC logic hotfix gates
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: muc
        run: bun test src/main/muc
      - name: HUBU skills and upgrade compatibility
        if: github.base_ref == 'hubu-main' || github.ref_name == 'hubu-main'
        working-directory: packages/core
        run: >-
          bun test test/skill-library.test.ts test/skill-registry-server.test.ts
          test/skill-source.test.ts test/skill-translation.test.ts
          test/skill-translation-service.test.ts test/campus-catalog.test.ts
          test/hubu-skill-registry.integration.test.ts test/tool-skill.test.ts
          test/config/config.test.ts test/session-runner.test.ts --timeout 30000
      - name: HUBU legacy model and retry contracts
        if: github.base_ref == 'hubu-main' || github.ref_name == 'hubu-main'
        working-directory: packages/opencode
        run: bun test test/provider/muc-vision.test.ts test/session/system.test.ts test/session/retry.test.ts test/tool/skill.test.ts --timeout 30000
      - name: HUBU compaction keeps task skills
        if: github.base_ref == 'hubu-main' || github.ref_name == 'hubu-main'
        working-directory: packages/opencode
        env:
          BRAND: hubu
        run: bun test test/session/compaction.test.ts -t 'compaction continuation preserves' --timeout 30000
      - name: HUBU feature copy covers every locale
        if: github.base_ref == 'hubu-main' || github.ref_name == 'hubu-main'
        working-directory: packages/app
        run: bun test src/i18n/parity.test.ts
      - name: Require canonical branch
        run: |
          candidate="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            candidate="${GITHUB_BASE_REF}"
          fi
          case "${candidate}" in
            muc-main|hubu-main|feat/dual-window-quota|feat/hubu-dual-window-quota|feat/reward-motion-system) ;;
            *) echo "Campus RC requires a canonical branch or an explicit release candidate" >&2; exit 1 ;;
          esac

  package:
    name: ${{ matrix.brand }} / ${{ matrix.target }}
    needs: source-gate
    strategy:
      fail-fast: false
      matrix:
        brand: [muc, hubu]
        target: [mac-arm64, mac-x64, win-x64]
        include:
          - target: mac-arm64
            os: macos-15
            platform: mac
            arch: arm64
            pty: "@lydell/node-pty-darwin-arm64"
          - target: mac-x64
            os: macos-15-intel
            platform: mac
            arch: x64
            pty: "@lydell/node-pty-darwin-x64"
          - target: win-x64
            os: windows-2025
            platform: win
            arch: x64
            pty: "@lydell/node-pty-win32-x64"
    runs-on: ${{ matrix.os }}
    env:
      CAMPUS_LOCAL_BUILD: "0"
      MUC_GATEWAY_URL: https://admin.wuxuexi.top
      HUBU_GATEWAY_URL: https://hubu.wuxuexi.top
      HUBU_UPDATE_FEED_URL: https://hubu.wuxuexi.top/downloads/hubu-updates/stable
      HUBU_MANIFEST_URL: https://hubu.wuxuexi.top/downloads/latest-hubu-ai.json
      HUBU_DOWNLOAD_BASE_URL: https://hubu.wuxuexi.top/downloads
      HUBU_WEBSITE_URL: https://hubu.wuxuexi.top/hubu
      # RC build configuration only; deployment and endpoint acceptance are separate steps.
      HUBU_SKILL_REGISTRY_URL: ${{ vars.HUBU_SKILL_REGISTRY_URL || 'https://hubu.wuxuexi.top/hubu-skills/' }}
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Build desktop
        env:
          OPENCODE_CHANNEL: ${{ matrix.brand }}
          BRAND: ${{ matrix.brand }}
          CAMPUS_BUILD_OUTPUT: dist/${{ matrix.brand }}-${{ matrix.target }}
          MUC_PTY_PKG: ${{ matrix.pty }}
        run: |
          bun run build
          bunx electron-builder --config electron-builder.config.ts --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged identity
        env:
          OPENCODE_CHANNEL: ${{ matrix.brand }}
          BRAND: ${{ matrix.brand }}
          CAMPUS_BUILD_OUTPUT: dist/${{ matrix.brand }}-${{ matrix.target }}
          CAMPUS_TARGET: ${{ matrix.target }}
        run: bun e2e/package-smoke.ts
      - name: Install and launch distributable
        timeout-minutes: 5
        env:
          OPENCODE_CHANNEL: ${{ matrix.brand }}
          BRAND: ${{ matrix.brand }}
          CAMPUS_BUILD_OUTPUT: dist/${{ matrix.brand }}-${{ matrix.target }}
          CAMPUS_TARGET: ${{ matrix.target }}
        run: |
          bun build e2e/installed-smoke.ts --target node --external '@playwright/test' --outfile e2e/installed-smoke.mjs
          node e2e/installed-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: campus-${{ matrix.brand }}-${{ matrix.target }}-${{ github.sha }}
          path: |
            packages/desktop/dist/${{ matrix.brand }}-${{ matrix.target }}/*.dmg
            packages/desktop/dist/${{ matrix.brand }}-${{ matrix.target }}/*.zip
            packages/desktop/dist/${{ matrix.brand }}-${{ matrix.target }}/*.exe
            packages/desktop/dist/${{ matrix.brand }}-${{ matrix.target }}/*.blockmap
            packages/desktop/dist/${{ matrix.brand }}-${{ matrix.target }}/*.yml
            packages/desktop/dist/${{ matrix.brand }}-${{ matrix.target }}/*.json
            packages/desktop/dist/${{ matrix.brand }}-${{ matrix.target }}/*.png
          if-no-files-found: error
          retention-days: 14
